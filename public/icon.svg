<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101C2C"/>
      <stop offset="100%" stop-color="#0A111B"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1677FF"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#36D6E7"/>
      <stop offset="100%" stop-color="#1677FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle border ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1677FF" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Protective Shield -->
  <path d="M256 70 C345 70, 400 115, 400 230 C400 345, 305 415, 256 442 C207 415, 112 345, 112 230 C112 115, 167 70, 256 70 Z" 
        fill="url(#shieldGrad)" fill-opacity="0.18" stroke="#1677FF" stroke-width="8"/>

  <!-- Road perspective lanes -->
  <path d="M190 390 L236 210 L276 210 L322 390 Z" fill="#101C2C" stroke="#36D6E7" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Dashed center divider -->
  <line x1="256" y1="230" x2="256" y2="270" stroke="#36D6E7" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="290" x2="256" y2="335" stroke="#36D6E7" stroke-width="7" stroke-linecap="round"/>
  <line x1="256" y1="355" x2="256" y2="385" stroke="#36D6E7" stroke-width="8" stroke-linecap="round"/>

  <!-- Steering wheel / Guidance arc -->
  <circle cx="256" cy="205" r="70" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="205" r="22" fill="#1677FF" stroke="#FFFFFF" stroke-width="6"/>
  <path d="M256 227 L256 270" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <path d="M236 215 L190 235" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <path d="M276 215 L322 235" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>

  <!-- Safe Checkmark / Star Badge at top of shield -->
  <circle cx="256" cy="115" r="22" fill="#36D6E7" filter="url(#glow)"/>
  <path d="M246 115 L253 122 L267 108" fill="none" stroke="#101C2C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
